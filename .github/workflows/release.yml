name: Release Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY after confirming the Cloudflare resources and production environment approvals
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afrespat-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate release credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURATOR_SETUP_TOKEN: ${{ secrets.CURATOR_SETUP_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#CURATOR_SETUP_TOKEN}" -ge 32
      - name: Prepare release bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: node src/preflight.js --prepare
      - run: npx wrangler deploy --dry-run --config wrangler.release.json
      - name: Apply remote migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply open-research-db --remote --config wrangler.release.json
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.release.json
      - name: Provision first-curator setup secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CURATOR_SETUP_TOKEN: ${{ secrets.CURATOR_SETUP_TOKEN }}
        run: printf '%s' "$CURATOR_SETUP_TOKEN" | npx wrangler secret put CURATOR_SETUP_TOKEN --config wrangler.release.json
